---
- name: 下載 k9s
  ansible.builtin.get_url:
    url: "{{ k9s_url }}"
    dest: /tmp/k9s.tar.gz
    mode: '0644'
    timeout: 120                   # 檔案約 40MB，放寬逾時
  register: k9s_download
  retries: 3                       # 網路抖動時最多重試 3 次
  delay: 5
  until: k9s_download is succeeded

- name: 解壓縮 k9s
  ansible.builtin.unarchive:
    src: /tmp/k9s.tar.gz
    dest: /tmp/
    remote_src: true

- name: 安裝 k9s binary
  become: true                     # 只有寫入 /usr/local/bin 需要 root
  ansible.builtin.copy:
    src: /tmp/k9s
    dest: "{{ k9s_bin_dir }}/k9s"
    mode: '0755'
    remote_src: true

- name: 確認 k9s 版本
  ansible.builtin.command: k9s version
  register: k9s_check
  changed_when: false

- name: 印出 k9s 版本
  ansible.builtin.debug:
    msg: "{{ k9s_check.stdout_lines }}"
