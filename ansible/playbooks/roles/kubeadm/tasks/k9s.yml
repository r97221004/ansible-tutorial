---
- name: 下載 k9s
  get_url:
    url: "{{ k9s_url }}"
    dest: /tmp/k9s.tar.gz
    mode: '0644'

- name: 解壓縮 k9s
  unarchive:
    src: /tmp/k9s.tar.gz
    dest: /tmp/
    remote_src: true

- name: 安裝 k9s binary
  copy:
    src: /tmp/k9s
    dest: /usr/local/bin/k9s
    mode: '0755'
    remote_src: true
