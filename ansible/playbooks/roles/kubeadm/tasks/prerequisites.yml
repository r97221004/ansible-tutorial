---
- name: 設定開機自動載入核心模組 (overlay, br_netfilter)
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: 立即載入 overlay 與 br_netfilter 核心模組
  command: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: 設定 Kubernetes 所需 sysctl 參數
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: '0644'
  register: k8s_sysctl

- name: 套用 sysctl 設定
  command: sysctl --system
  when: k8s_sysctl.changed

- name: 更新 apt cache
  apt:
    update_cache: true
  ignore_errors: true

- name: 安裝前置套件
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present

- name: 建立 keyrings 目錄
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: 下載 Kubernetes apt key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | \
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: 加入 Kubernetes apt repository
  lineinfile:
    path: /etc/apt/sources.list.d/kubernetes.list
    line: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
    create: true

- name: 安裝 kubelet kubeadm kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: 鎖定版本，避免自動升級
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
