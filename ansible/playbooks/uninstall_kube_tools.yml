---
# Uninstall cluster operation tools (k9s)
# Removes k9s from the control node by default; for the local machine add -i inventory/localhost.ini and switch hosts: local
# Usage: ansible-playbook playbooks/uninstall_kube_tools.yml
- name: Uninstall kube tools
  hosts: control
  roles:
    - role: kube_tools
      kube_tools_state: absent
